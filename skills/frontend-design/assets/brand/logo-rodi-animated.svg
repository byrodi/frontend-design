<svg xmlns="http://www.w3.org/2000/svg" viewBox="-11 -61 482 172" role="img" aria-label="rodi."><style>path{stroke-dasharray:1 2;stroke-dashoffset:1;opacity:0;animation:draw .5s cubic-bezier(.45,0,.25,1) forwards}
.i{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .3s 1.15s cubic-bezier(.3,1.6,.5,1) forwards}
.p{transform:translateY(-200px);opacity:0;animation:drop .7s 1.35s forwards}
@keyframes draw{0%{opacity:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes drop{0%{opacity:1;transform:translateY(-200px);animation-timing-function:cubic-bezier(.33,0,.67,.33)}
36.4%{transform:none;animation-timing-function:cubic-bezier(.33,.67,.67,1)}
54.5%{transform:translateY(-50px);animation-timing-function:cubic-bezier(.33,0,.67,.33)}
72.7%{transform:none;animation-timing-function:cubic-bezier(.33,.67,.67,1)}
81.8%{transform:translateY(-12.5px);animation-timing-function:cubic-bezier(.33,0,.67,.33)}
90.9%{transform:none;animation-timing-function:cubic-bezier(.33,.67,.67,1)}
95.5%{transform:translateY(-3px);animation-timing-function:cubic-bezier(.33,0,.67,.33)}
to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){path,.i,.p{animation:none;stroke-dashoffset:0;transform:none;opacity:1}}</style><g fill="none" stroke="#29242A" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M0,100 V50 A50,50 0 0 1 50,0 H58" pathLength="1" style="animation-delay:0.0s;animation-duration:0.45s"/><path d="M156,0 A50,50 0 0 0 106,50 A50,50 0 0 0 156,100 A50,50 0 0 0 206,50 A50,50 0 0 0 156,0" pathLength="1" style="animation-delay:0.25s;animation-duration:0.50s"/><path d="M304,0 A50,50 0 0 0 254,50 A50,50 0 0 0 304,100 A50,50 0 0 0 354,50 A50,50 0 0 0 304,0" pathLength="1" style="animation-delay:0.5s;animation-duration:0.50s"/><path d="M354,-50 V100" pathLength="1" style="animation-delay:0.8s;animation-duration:0.30s"/><path d="M406,0 V100" pathLength="1" style="animation-delay:0.95s;animation-duration:0.30s"/><circle class="i" cx="406" cy="-45" r="13" fill="#29242A" stroke="none"/><circle class="p" cx="457" cy="97" r="14" fill="#D78494" stroke="none"/></g></svg>
